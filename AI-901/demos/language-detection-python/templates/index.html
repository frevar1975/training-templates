<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio de análisis de texto</title>
  <style>
    :root { font-family: "Segoe UI", Arial, sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { padding: 22px max(22px, calc((100% - 1000px)/2)); background: #102a56; color: white; }
    header span { color: #a9c7ff; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
    main { width: min(900px, calc(100% - 32px)); margin: 38px auto; }
    .card { background: white; border: 1px solid #e0e7f0; border-radius: 16px; padding: clamp(20px, 4vw, 34px); box-shadow: 0 12px 36px #14274a12; }
    h1 { margin: 0 0 10px; font-size: clamp(25px, 4vw, 36px); }
    .intro { color: #58657a; line-height: 1.55; margin: 0 0 25px; }
    label { display: block; font-weight: 650; margin: 18px 0 8px; }
    select, textarea { width: 100%; border: 1px solid #b9c5d6; border-radius: 10px; padding: 13px; font: inherit; background: white; }
    textarea { min-height: 185px; resize: vertical; line-height: 1.5; }
    select:focus, textarea:focus { outline: 3px solid #bcd6ff; border-color: #1769d2; }
    .actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
    button { border: 0; border-radius: 9px; padding: 12px 20px; color: white; background: #1769d2; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #0d54b2; }
    button:disabled { opacity: .65; cursor: wait; }
    .hint, footer { color: #69768a; font-size: 13px; }
    #status { margin-top: 22px; }
    .result { background: #eff8f2; border: 1px solid #b8e2c4; border-radius: 12px; padding: 18px; }
    .result h2 { margin: 0 0 14px; font-size: 20px; color: #176334; }
    .summary { margin: 0 0 14px; line-height: 1.55; }
    .items { display: grid; gap: 9px; }
    .item { display: flex; gap: 8px; flex-wrap: wrap; background: white; padding: 11px 13px; border-radius: 8px; }
    .item strong { min-width: 120px; }
    .detail, .note { color: #647187; font-size: 13px; }
    .note { margin: 14px 0 0; }
    .redacted { margin-top: 16px; padding: 13px; background: white; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .error { background: #fff1f0; color: #9f2520; border: 1px solid #f2c3bf; border-radius: 10px; padding: 14px; }
    footer { text-align: center; margin: 18px 0 36px; }
  </style>
</head>
<body>
  <header><span>DEMO EDUCATIVA · AZURE AI LANGUAGE</span></header>
  <main>
    <section class="card">
      <h1>Laboratorio de análisis de texto</h1>
      <p class="intro">Elige una tarea, escribe o pega un texto y observa el resultado de Azure AI Language.</p>
      <form id="form">
        <label for="task">Tarea de análisis</label>
        <select id="task">
          <option value="language">Detectar idioma</option>
          <option value="pii">Detectar información personal (PII)</option>
          <option value="key_phrases">Extraer frases clave</option>
          <option value="entities">Reconocer entidades</option>
          <option value="sentiment">Analizar sentimiento</option>
          <option value="summary">Crear resumen introductorio</option>
        </select>
        <label for="text">Texto para analizar</label>
        <textarea id="text" maxlength="5000" placeholder="Escribe o pega aquí el texto que quieras analizar…" required></textarea>
        <div class="actions">
          <button id="submit" type="submit">Analizar texto</button>
          <span class="hint">Hasta 5.000 caracteres · el texto se envía a Azure para su análisis</span>
        </div>
      </form>
      <div id="status" aria-live="polite"></div>
    </section>
    <footer>Demo local para aprendizaje. No uses información personal real.</footer>
  </main>
  <script>
    const form = document.querySelector("#form");
    const button = document.querySelector("#submit");
    const statusBox = document.querySelector("#status");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Analizando…";
      statusBox.replaceChildren();
      try {
        const response = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#text").value, task: document.querySelector("#task").value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "No se pudo analizar el texto.");
        const panel = document.createElement("section"); panel.className = "result";
        const title = document.createElement("h2"); title.textContent = data.title || "Resultado"; panel.append(title);
        if (data.summary) { const summary = document.createElement("p"); summary.className = "summary"; summary.textContent = data.summary; panel.append(summary); }
        if (data.items && data.items.length) {
          const list = document.createElement("div"); list.className = "items";
          data.items.forEach((entry) => {
            const row = document.createElement("div"); row.className = "item";
            const label = document.createElement("strong"); label.textContent = entry.label || "Resultado";
            const value = document.createElement("span"); value.textContent = entry.value || "";
            row.append(label, value);
            if (entry.detail) { const detail = document.createElement("span"); detail.className = "detail"; detail.textContent = entry.detail; row.append(detail); }
            list.append(row);
          }); panel.append(list);
        }
        if (data.redacted_text) { const redacted = document.createElement("div"); redacted.className = "redacted"; redacted.textContent = "Texto con datos detectados ocultos:\n" + data.redacted_text; panel.append(redacted); }
        if (data.note) { const note = document.createElement("p"); note.className = "note"; note.textContent = data.note; panel.append(note); }
        statusBox.append(panel);
      } catch (error) {
        const message = document.createElement("div"); message.className = "error"; message.textContent = error.message; statusBox.append(message);
      } finally { button.disabled = false; button.textContent = "Analizar texto"; }
    });
  </script>
</body>
</html>
