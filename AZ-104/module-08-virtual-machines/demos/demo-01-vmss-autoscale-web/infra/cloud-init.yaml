#cloud-config
write_files:
  - path: /opt/az104/app.py
    permissions: '0644'
    encoding: b64
    content: __APP_BASE64__
  - path: /etc/systemd/system/az104-web.service
    permissions: '0644'
    content: |
      [Unit]
      Description=AZ104 demo web
      After=network-online.target
      [Service]
      User=www-data
      Environment=PORT=8080
      ExecStart=/usr/bin/python3 /opt/az104/app.py
      Restart=always
      RestartSec=3
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, az104-web]
